services:
  autoclip-server:
    build: .
    ports: ["3000:3000"]
    image: ghcr.io/mayank31313/autoclip
    environment:
      DATABASE_URL: postgres://autoclip:autoclip@postgres:5432/autoclip
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: autoclip
      API_KEY_PEPPER: change-me-to-a-long-random-string
      WEBHOOK_SIGNING_SECRET: change-me-to-another-long-random-string
    depends_on: ["postgres", "redis", "minio"]
  autoclip-worker:
    image: ghcr.io/mayank31313/autoclip
    environment:
      DATABASE_URL: postgres://autoclip:autoclip@postgres:5432/autoclip
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: autoclip
      API_KEY_PEPPER: change-me-to-a-long-random-string
      WEBHOOK_SIGNING_SECRET: change-me-to-another-long-random-string
    depends_on: ["postgres", "redis", "minio"]
    command: ["npm", "run", "worker"]
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: autoclip, POSTGRES_PASSWORD: autoclip, POSTGRES_DB: autoclip }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    # minio/minio was removed from Docker Hub; bitnamilegacy/minio bundles mc and creates the bucket.
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: autoclip
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
volumes: { pgdata: {}, miniodata: {} }
