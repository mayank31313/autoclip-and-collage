name: Test and publish images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --maxWorkers=2

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image owner
        if: github.event_name == 'push'
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: printf 'owner=%s\n' "${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          target: ${{ matrix.image }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/autoclip-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.owner }}/autoclip-${{ matrix.image }}:latest
